# Ajustado a un equipo con ~6 GB de RAM (con -Xmx8G el daemon se caía por falta de memoria).
# --enable-native-access evita el aviso "restricted method in java.lang.System" de
# Java 24+ en el daemon. El lanzador de Gradle lo imprime igual y no se puede
# silenciar desde el proyecto sin romper gradlew con un Java viejo (es inofensivo).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# El daemon de Kotlin es otro proceso Java; limitarlo también
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
# Kotlin integrado desactivado: share_plus 12 todavía aplica el plugin de Kotlin
# (share_plus 13 lo soporta, pero exige flutter_secure_storage 11)
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
