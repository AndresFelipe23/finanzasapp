<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<!--
  Piezas de TikTok de Financially (1080 × 1920). Uso:
    tiktok.html?t=<clave>   → fondo con el texto de esa escena (ver "textos")
    tiktok.html?t=fin       → cierre · tiktok.html?t=portada → portada del carrusel
    tiktok.html?bisel=1     → marco del teléfono (pantalla transparente)
    tiktok.html?mascara=1   → máscara redondeada del video (540 × 1151)
  Zonas seguras: los botones de TikTok van a la derecha (x > 940) y la
  descripción abajo (y > 1650). El texto va entre y=180 y y=560, y el
  teléfono a la izquierda del centro: hueco x=250, y=600, 540 × 1151, radio 58
  (igual que en armar-tiktok.sh).
-->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;background:transparent}
  .fondo{position:absolute;inset:0;color:#fff}
  .texto{position:absolute;left:70px;right:140px;top:180px;height:380px;display:flex;align-items:center;justify-content:center;text-align:center}
  h1{margin:0;font-size:84px;line-height:1.05;font-weight:800;letter-spacing:-2px}
  /* Texto tipo TikTok: fondo blanco detrás de cada línea */
  h1 span{background:#fff;color:#10201B;padding:4px 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.3}
  h1 em{font-style:normal;color:#0B6E4F}
  .centro{position:absolute;left:70px;right:140px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .centro svg{width:180px;height:180px;margin-bottom:46px}
  .centro h2{margin:0;font-size:96px;line-height:1.05;font-weight:800;letter-spacing:-2px}
  .centro p{margin:30px 0 0;font-size:42px;font-weight:600;opacity:.85}
  .centro .pronto{margin-top:46px;display:inline-flex;background:#fff;color:#0B3B2C;border-radius:999px;padding:18px 34px;font-size:36px;font-weight:800}
  .bisel{position:absolute;left:236px;top:586px;width:568px;height:1179px;border-radius:72px;box-sizing:border-box;
    border:14px solid #0a1712;box-shadow:0 40px 90px rgba(0,0,0,.35)}
  .mascara{position:absolute;left:0;top:0;width:540px;height:1151px;border-radius:58px;background:#fff}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="logo" viewBox="0 0 96 96">
  <rect width="96" height="96" rx="24" fill="#124A38"/>
  <rect x="30" y="22" width="13" height="52" rx="4" fill="#7FD1AE"/><rect x="30" y="22" width="38" height="13" rx="4" fill="#7FD1AE"/>
  <rect x="30" y="43" width="27" height="12" rx="4" fill="#7FD1AE"/><circle cx="68" cy="67" r="7" fill="#F0A673"/>
</symbol></defs></svg>
<div id="raiz"></div>
<script>
  // clave: [color de fondo, texto]
  const textos = {
    // Video 1 · registro automático
    sola:      ['#0B6E4F', '<span>Esta app anota</span><br><span>mis gastos <em>sola</em></span>'],
    toques:    ['#B4531A', '<span>Y si lo hago a mano,</span><br><span>son <em style="color:#B4531A">3 toques</em></span>'],
    // Video 2 · control
    pov:       ['#0B3B2C', '<span>POV: por fin sabes</span><br><span>en qué se va <em>tu plata</em></span>'],
    avisa:     ['#124A38', '<span>Y te avisa antes</span><br><span>de <em>pasarte</em></span>'],
    // Video 3 · ahorro, créditos y widget
    ahorro:    ['#6B3FA0', '<span>Así ahorro</span><br><span><em style="color:#6B3FA0">sin pensarlo</em></span>'],
    creditos:  ['#1F5FAD', '<span>Llevo mis créditos</span><br><span><em style="color:#1F5FAD">cuota por cuota</em></span>'],
    widget:    ['#0B3B2C', '<span>Y registro sin</span><br><span><em>abrir la app</em></span>'],
  };
  const q = new URLSearchParams(location.search);
  const raiz = document.getElementById('raiz');
  const fondo = (c) => `radial-gradient(900px 800px at 85% 0%, rgba(255,255,255,.14), transparent 70%), ${c}`;
  const t = q.get('t');
  if (q.get('mascara')) {
    document.body.style.background = '#000';
    raiz.innerHTML = '<div class="mascara"></div>';
  } else if (q.get('bisel')) {
    raiz.innerHTML = '<div class="bisel"></div>';
  } else if (t === 'fin') {
    raiz.innerHTML = `<div class="fondo" style="background:${fondo('#0B3B2C')}"><div class="centro">
      <svg><use href="#logo"/></svg><h2>Financially</h2><p>Tus finanzas claras, sin esfuerzo</p>
      <div class="pronto">Muy pronto en Google Play</div></div></div>`;
  } else if (t === 'portada') {
    raiz.innerHTML = `<div class="fondo" style="background:${fondo('#0B3B2C')}"><div class="centro">
      <svg><use href="#logo"/></svg>
      <h2 style="font-size:88px">8 cosas que esta<br>app hace por<br>tu <span style="color:#7FD1AE">bolsillo</span></h2>
      <p>Desliza para verlas</p></div></div>`;
  } else {
    const [c, h] = textos[t];
    raiz.innerHTML = `<div class="fondo" style="background:${fondo(c)}"><div class="texto"><h1>${h}</h1></div></div>`;
  }
</script>
</body></html>
