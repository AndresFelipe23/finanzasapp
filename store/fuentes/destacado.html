<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root{--deep:#0B3B2C;--card:#124A38;--mint:#7FD1AE;--peach:#F0A673;--bg:#F4F5F1;--ink:#10201B;--muted:#5A6762;--accent:#0B6E4F;--expense:#B4531A;--border:#E3E6E0}
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
  .lienzo{position:relative;width:1024px;height:500px;background:
    radial-gradient(600px 400px at 85% 30%, #1D5A45 0%, transparent 70%),
    radial-gradient(500px 300px at 10% 110%, #124A38 0%, transparent 70%), var(--deep);color:#fff}
  .texto{position:absolute;left:72px;top:92px;width:470px}
  .marca{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:.2px}
  .marca svg{width:44px;height:44px}
  h1{margin:26px 0 14px;font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-1px}
  h1 span{color:var(--mint)}
  p{margin:0;font-size:18px;line-height:1.5;color:#B9D6C9;font-weight:500}
  .chips{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:#E6F2EC}

  /* Teléfono */
  .tel{position:absolute;right:92px;top:46px;width:236px;height:480px;border-radius:38px;background:#0a1712;padding:9px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(-6deg)}
  .pantalla{width:100%;height:100%;border-radius:30px;background:var(--bg);overflow:hidden;color:var(--ink);padding:16px 13px}
  .pantalla.real{padding:0}
  .pantalla.real img{width:100%;display:block;margin-top:-9.2%}
  .saludo{font-size:11px;color:var(--muted);font-weight:600}
  .nombre{font-size:15px;font-weight:800;margin-bottom:10px}
  .saldo{background:var(--ink);border-radius:18px;padding:13px 14px;color:#fff}
  .saldo small{font-size:10px;color:#B9C6C0;font-weight:600}
  .saldo b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
  .fila{display:flex;gap:8px}
  .mini{flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 8px}
  .mini small{display:block;font-size:8.5px}
  .mini span{font-size:11px;font-weight:800}
  .sec{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin:12px 2px 6px}
  .mov{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:8px 9px;margin-bottom:6px}
  .ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .mov div{flex:1}
  .mov b{display:block;font-size:11px}
  .mov small{font-size:9px;color:var(--muted)}
  .mov .m{font-size:11px;font-weight:800}
  .ppto{background:#fff;border:1px solid var(--border);border-radius:13px;padding:9px 10px}
  .ppto b{font-size:11px}
  .barra{height:7px;background:#E9ECE6;border-radius:4px;margin-top:6px;overflow:hidden}
  .barra i{display:block;height:100%;width:72%;background:var(--accent);border-radius:4px}
</style></head>
<body><div class="lienzo">
  <div class="texto">
    <div class="marca">
      <svg viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="#124A38"/>
        <rect x="30" y="22" width="13" height="52" rx="4" fill="#7FD1AE"/><rect x="30" y="22" width="38" height="13" rx="4" fill="#7FD1AE"/>
        <rect x="30" y="43" width="27" height="12" rx="4" fill="#7FD1AE"/><circle cx="68" cy="67" r="7" fill="#F0A673"/></svg>
      Financially
    </div>
    <h1>Tus finanzas <span>claras</span>,<br>sin esfuerzo</h1>
    <p>Registra gastos en segundos, controla tus presupuestos y alcanza tus metas de ahorro.</p>
    <div class="chips">
      <span class="chip">Registro automático</span>
      <span class="chip">Presupuestos</span>
      <span class="chip">Metas</span>
      <span class="chip">Préstamos</span>
    </div>
  </div>

  <!-- Pantalla real del Inicio (capturas/1.png), sin la barra de estado -->
  <div class="tel"><div class="pantalla real"><img src="../capturas/1.png" alt=""></div></div>
</div></body></html>
