<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<!--
  Plantilla de capturas para Play Store (1080 × 1920). Uso:
    captura.html?n=1  → usa capturas/1.png y el texto 1 de abajo
  Se genera con generar-capturas.sh.
-->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
  .lienzo{position:relative;width:1080px;height:1920px;color:#fff;overflow:hidden}
  .titulo{position:absolute;left:90px;right:90px;top:120px;text-align:center}
  .titulo h1{margin:0;font-size:76px;line-height:1.08;font-weight:800;letter-spacing:-1.6px}
  .titulo p{margin:22px auto 0;font-size:36px;line-height:1.35;font-weight:600;opacity:.82;max-width:820px}
  .tel{position:absolute;left:50%;top:520px;width:760px;height:1600px;transform:translateX(-50%);
    background:#0a1712;border-radius:96px;padding:22px;box-shadow:0 40px 90px rgba(0,0,0,.35)}
  /* La pantalla va recortada arriba (la barra de estado del teléfono: hora,
     batería) para que todas las capturas se vean limpias e iguales */
  .pantalla{position:relative;width:100%;height:100%;border-radius:76px;overflow:hidden;background:#F4F5F1}
  /* Tapa la parte de abajo de la pantalla (p. ej. íconos de otras apps en la
     captura del widget: no se muestran marcas ajenas en la tienda) */
  .tapa{position:absolute;left:0;right:0;bottom:0;display:none}
  .pantalla img{width:100%;display:block;margin-top:-9.2%} /* ~112 px de 1220: la barra de estado */
</style></head>
<body>
<div class="lienzo" id="lienzo">
  <div class="titulo"><h1 id="h"></h1><p id="p"></p></div>
  <div class="tel"><div class="pantalla"><img id="img" alt=""><div class="tapa" id="tapa"></div></div></div>
</div>
<script>
  // Un fondo por captura (colores de la marca) y su mensaje
  const capturas = {
    1: ['#0B3B2C', 'Todo tu dinero en un vistazo', 'Saldos, gastos del mes y movimientos en una sola pantalla.'],
    2: ['#B4531A', 'Registra un gasto en segundos', 'Monto, categoría y listo. Con su propio teclado.'],
    3: ['#0B6E4F', 'Se registra solo', 'Lee los avisos de tu banco y anota tus compras e ingresos.'],
    4: ['#124A38', 'Controla tus presupuestos', 'Te avisamos cuando vas en el 80% y el 100%.'],
    5: ['#6B3FA0', 'Ahorra para tus metas', 'Aparta un porcentaje de cada ingreso, automáticamente.'],
    6: ['#1F5FAD', 'Tus créditos bajo control', 'Cuotas, intereses y un aviso antes de cada pago.'],
    7: ['#0B3B2C', 'Entiende en qué se va tu plata', 'Gráficas claras por categoría y por mes.'],
    // 4.º dato opcional: [alto en px, color] para tapar el final de la pantalla
    8: ['#0B6E4F', 'Registra sin abrir la app', 'Widget y atajos en los ajustes rápidos.', [330, '#0E1A3A']],
  };
  const n = new URLSearchParams(location.search).get('n') || '1';
  const [color, h, p, tapa] = capturas[n];
  if (tapa) {
    const t = document.getElementById('tapa');
    t.style.display = 'block';
    t.style.height = tapa[0] + 'px';
    t.style.background = `linear-gradient(to bottom, transparent, ${tapa[1]} 45%)`;
  }
  document.getElementById('lienzo').style.background =
    `radial-gradient(900px 700px at 80% 0%, rgba(255,255,255,.12), transparent 70%), ${color}`;
  document.getElementById('h').textContent = h;
  document.getElementById('p').textContent = p;
  document.getElementById('img').src = `../capturas/${n}.png`;
</script>
</body></html>
