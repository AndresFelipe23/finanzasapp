<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=block" rel="stylesheet">
<!-- Ícono de desarrollador afesdev (512 × 512, sin transparencia). Play lo
     recorta en círculo: el monograma va centrado con margen. -->
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden}
  .lienzo{width:512px;height:512px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(360px 360px at 70% 20%, #2A3350 0%, transparent 70%), #101828;
    font-family:Manrope,system-ui,sans-serif}
  .mono{font-size:230px;font-weight:800;letter-spacing:-12px;color:#fff;line-height:1;transform:translate(6px,-10px)}
  .mono span{display:inline-block;width:46px;height:46px;border-radius:50%;background:#FF6B4A;margin-left:10px;vertical-align:baseline}
</style></head>
<body><div class="lienzo"><div class="mono">af<span></span></div></div></body></html>
